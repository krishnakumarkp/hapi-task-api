services:
  mysql:
    image: mysql:8.4
    container_name: hapi-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: hapi_tasks
      MYSQL_USER: hapi_user
      MYSQL_PASSWORD: hapipassword

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: